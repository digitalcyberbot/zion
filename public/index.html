            .login-card { width: calc(100vw - 32px); max-width: 360px; padding: 28px 22px; box-sizing: border-box; }
            .profile-card {
                position: fixed; top: var(--mobile-viewport-top, 0px); left: var(--mobile-viewport-left, 0px); width: var(--mobile-viewport-width, 100vw); height: var(--mobile-viewport-height, 100dvh); min-height: 0; max-height: none;

                border-radius: 0; box-sizing: border-box;

    <script type="module">
        import * as THREE from 'three';

        function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) { reject("Geolocation not supported"); } 
                else { navigator.geolocation.getCurrentPosition((position) => resolve(position.coords), (error) => reject(error)); }
            });
        }
        async function fetchWeatherData(lat, long) {
            try { const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${long}&current_weather=true`); const data = await response.json(); return data.current_weather; } 
            catch (error) { console.error("Weather fetch failed:", error); return null; }
        }

        window.addEventListener('contextmenu', (e) => e.preventDefault());
        const socket = io(); 
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        function getDisplayPfp(userOrColor) {
            let color = '#333';
            if (userOrColor && typeof userOrColor === 'object') {
                const pfp = typeof userOrColor.pfp === 'string' ? userOrColor.pfp.trim() : '';
                if (/^(data:image\/|https?:\/\/|blob:|\/)/i.test(pfp)) return pfp;
                color = userOrColor.color || '#333';
            } else if (typeof userOrColor === 'string') { color = userOrColor; }
            if (!/^#[0-9A-F]{6}$/i.test(color)) color = '#007AFF';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${color}"/></svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function findActiveUser(username) {
            if (!username) return null;
            return Object.values(state.users || {}).find(user => user && user.username === username) || null;
        }

        function cacheProfile(profile) {
            if (!profile || !profile.username) return;
            state.profileCache[profile.username] = {
                ...(state.profileCache[profile.username] || {}),
                ...profile
            };
        }

        function cacheProfiles(profiles) {
            if (!profiles) return;
            if (Array.isArray(profiles)) profiles.forEach(cacheProfile);
            else Object.values(profiles).forEach(cacheProfile);
        }

        function findKnownUser(username) {
            return findActiveUser(username) || state.profileCache[username] || null;
        }

        function setSafeAvatar(img, username, snapshot = {}) {
            if (!img) return;
            const knownUser = findKnownUser(username);
            const sourceUser = knownUser || {
                pfp: snapshot.userPfp || snapshot.pfp || '',
                color: snapshot.userColor || snapshot.color || '#666'
            };
            const fallbackColor = sourceUser.color || snapshot.userColor || snapshot.color || '#666';
            const source = getDisplayPfp(sourceUser);
            const fallback = getDisplayPfp(fallbackColor);
            const avatarKey = `${source.length}:${source.slice(0, 36)}:${source.slice(-20)}`;
            if (img.dataset.avatarKey === avatarKey) return;
            img.dataset.avatarKey = avatarKey;
            if (username) img.dataset.username = username;
            img.decoding = 'async';
            img.onerror = () => {
                img.onerror = null;
                img.dataset.avatarKey = '';
                img.src = fallback;
            };
            img.src = source || fallback;
        }

        function refreshVisibleAvatars() {
            document.querySelectorAll('.msg-pfp[data-username]').forEach(img => {
                const knownUser = findKnownUser(img.dataset.username);
                if (knownUser) setSafeAvatar(img, img.dataset.username, knownUser);
            });
        }

        function setBackgroundAvatar(element, userOrColor) {
            if (!element) return;
            const source = getDisplayPfp(userOrColor);
            element.style.backgroundImage = `url(${JSON.stringify(source)})`;
            const fallbackColor = userOrColor && typeof userOrColor === 'object' ? userOrColor.color : userOrColor;
            const probe = new Image();
            probe.onerror = () => {
                const fallback = getDisplayPfp(fallbackColor || '#666');
                element.style.backgroundImage = `url(${JSON.stringify(fallback)})`;
            };
            probe.src = source;
        }
        function hexToRgba(hex, alpha) {
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) { r = parseInt(hex[1] + hex[1], 16); g = parseInt(hex[2] + hex[2], 16); b = parseInt(hex[3] + hex[3], 16); } 
            else if (hex.length === 7) { r = parseInt(hex.substring(1, 3), 16); g = parseInt(hex.substring(3, 5), 16); b = parseInt(hex.substring(5, 7), 16); }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        function adjustBrightness(col, amt) {
            const usePound = col.startsWith('#');
            const hex = usePound ? col.slice(1) : col;
            const num = parseInt(hex, 16);
            if (Number.isNaN(num)) return col;
            const clamp = (value) => Math.max(0, Math.min(255, value));
            const r = clamp((num >> 16) + amt);
            const g = clamp(((num >> 8) & 0x00FF) + amt);
            const b = clamp((num & 0x0000FF) + amt);
            const adjusted = ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
            return `${usePound ? '#' : ''}${adjusted}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        const state = { currentUser: null, users: {}, profileCache: {}, history: [], chatContext: 'public', dmContacts: new Set(), unread: {}, pinned: [] };
        const conversationState = new Map();
        let isUserAtBottom = true; let unreadCount = 0; let dividerElement = null; let isMinimized = false; let isMaximized = false; let pfpPendingReset = false;
        let historyRequestSeq = 0;
        let lastMessageTime = 0;
        let searchRequestSeq = 0;
        let searchJumpSeq = 0;
        let searchTimer = null;
        let searchResults = [];
        let searchTerm = '';
        let searchContextActive = false;
        let searchRestoreAnchor = null;
        let searchRestoreWasBottom = true;

        function getConversation(context = state.chatContext) {
            const key = (typeof context === 'string' && context) ? context : 'public';
            if (!conversationState.has(key)) {
                conversationState.set(key, { messages: [], loaded: false, loading: false, hasMore: true, requestId: null });
            }
            return conversationState.get(key);
        }

        function syncActiveHistory() {
            state.history = getConversation(state.chatContext).messages;
            return state.history;
        }

        function contextForMessage(data, myName = state.currentUser && state.currentUser.username) {
            if (!data || !data.toUser) return 'public';
            if (!myName) return null;
            if (data.user === myName) return data.toUser || null;
            if (data.toUser === myName) return data.user || null;
            return null;
        }

        function allCachedMessages() {
            const result = [];
            conversationState.forEach(conversation => result.push(...conversation.messages));
            return result;
        }

        function getDynamicTime(dateInput) {
            if(!dateInput) return '';
            const date = new Date(dateInput); 
            if(isNaN(date.getTime())) return '';
            const now = new Date(); const diffSeconds = Math.floor((now - date) / 1000);
            if (diffSeconds < 60) return 'Just now';
            if (diffSeconds < 3600) return `${Math.floor(diffSeconds / 60)}m ago`;
            if (diffSeconds < 86400 && date.getDate() === now.getDate()) return `Today at ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            if (date.toDateString() === yesterday.toDateString()) return `Yesterday at ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            return `${date.toLocaleDateString()} ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }
        function updateAllTimestamps() {
            document.querySelectorAll('.msg-timestamp').forEach(el => {
                const ts = el.getAttribute('data-ts');
                if (ts) { el.innerText = getDynamicTime(parseInt(ts)); }
            });
        }
        setInterval(updateAllTimestamps, 60000);

        socket.on('connect', () => { statusDot.style.background = '#00ff00'; statusText.innerText = 'CONNECTED'; });
        socket.on('disconnect', () => { statusDot.style.background = 'red'; statusText.innerText = 'DISCONNECTED'; });

        function formatTime(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        const chatWindow = document.getElementById('chat-window');
        let lastSenderId = null; let currentGroup = null; let pendingFiles = []; let currentReply = null;
        let bottomPinToken = 0; let bottomPinContext = null; let bottomPinUntil = 0;

        function cancelBottomPin() {
            bottomPinToken++;
            bottomPinContext = null;
            bottomPinUntil = 0;
        }

        function pinChatToLatest(context = state.chatContext) {
            const token = ++bottomPinToken;
            bottomPinContext = context;
            bottomPinUntil = performance.now() + 1400;
            isUserAtBottom = true;

            const pin = () => {
                if (token !== bottomPinToken || bottomPinContext !== context || context !== state.chatContext || isMinimized) return;
                chatWindow.scrollTop = chatWindow.scrollHeight;
                isUserAtBottom = true;
            };

            pin();
            requestAnimationFrame(() => { pin(); requestAnimationFrame(pin); });
            [60, 180, 420, 900, 1350].forEach(delay => setTimeout(pin, delay));
        }

        function keepLatestVisibleAfterLayoutChange() {
            const pinIsSettling = bottomPinContext === state.chatContext && performance.now() < bottomPinUntil;
            if ((!pinIsSettling && !isUserAtBottom) || isMinimized) return;
            requestAnimationFrame(() => {
                const stillSettling = bottomPinContext === state.chatContext && performance.now() < bottomPinUntil;
                if (stillSettling || isUserAtBottom) {
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    isUserAtBottom = true;
                }
            });
        }

        function watchMessageMediaLayout(element) {
            if (!element) return;
            element.addEventListener('load', keepLatestVisibleAfterLayoutChange, { once: true });
            element.addEventListener('loadedmetadata', keepLatestVisibleAfterLayoutChange, { once: true });
            element.addEventListener('error', keepLatestVisibleAfterLayoutChange, { once: true });
            if ((element.tagName === 'IMG' && element.complete) || (element.tagName === 'VIDEO' && element.readyState >= 1)) {
                keepLatestVisibleAfterLayoutChange();
            }
        }

        function finishMobileMinimize(chatUi, minText) {
            chatUi.classList.remove('mobile-closing', 'maximized');
            chatUi.classList.add('minimized');
            isMinimized = true;
            isMaximized = false;
            minText.innerText = unreadCount > 0 ? `${unreadCount} New Messages` : "Messages";
        }

        window.toggleMinMax = function(action) {
            const chatUi = document.getElementById('chat-ui');
            const minText = document.getElementById('minimized-text');
            const isMobile = window.matchMedia('(max-width: 700px)').matches;

            if (action === 'min' || (action === undefined && !isMinimized)) {
                if (isMobile && !isMinimized) {
                    chatUi.classList.remove('mobile-opening');
                    chatUi.classList.add('mobile-closing');
                    setTimeout(() => finishMobileMinimize(chatUi, minText), 190);
                } else {
                    finishMobileMinimize(chatUi, minText);
                }
            } else if (action === 'max') {
                chatUi.classList.remove('minimized');
                if(isMaximized) {
                    chatUi.classList.remove('maximized'); isMaximized = false;
                } else {
                    chatUi.classList.add('maximized'); isMaximized = true; isMinimized = false;
                }
            } else {
                const wasMinimized = isMinimized;
                chatUi.classList.remove('minimized', 'mobile-closing');
                if(isMaximized) chatUi.classList.add('maximized');
                isMinimized = false;
                clearUnreadState();
                if (isMobile && wasMinimized) {
                    chatUi.classList.remove('mobile-opening');
                    void chatUi.offsetWidth;
                    chatUi.classList.add('mobile-opening');
                    setTimeout(() => chatUi.classList.remove('mobile-opening'), 300);
                }
                setTimeout(() => pinChatToLatest(state.chatContext), isMobile ? 40 : 100);
            }
        };

        const searchInput = document.getElementById('search-input');
        const searchPanel = document.getElementById('search-panel');
        const searchPanelTitle = document.getElementById('search-panel-title');
        const searchResultsList = document.getElementById('search-results-list');
        const searchPanelClose = document.getElementById('search-panel-close');

        function isSearchableMessage(data) {
            if (!data || data.user === 'System' || typeof data.text !== 'string' || !data.text.trim()) return false;
            const type = String(data.type || 'user').toLowerCase();
            return !['bot', 'system', 'notification'].includes(type);
        }

        function clearSearchHighlights() {
            chatWindow.querySelectorAll('.message-bubble.search-current').forEach(el => el.classList.remove('search-current'));
        }

        function closeSearchPanel() {
            searchPanel.classList.remove('open');
        }

        function openSearchPanel() {
            if (!searchTerm) return;
            document.querySelectorAll('.side-panel').forEach(panel => {
                if (panel !== searchPanel) panel.classList.remove('open');
            });
            searchPanel.classList.add('open');
        }

        function appendHighlightedText(container, text, term) {
            const value = String(text || '');
            const query = String(term || '');
            if (!query) {
                container.textContent = value;
                return;
            }
            const lowerValue = value.toLowerCase();
            const lowerQuery = query.toLowerCase();
            let offset = 0;
            while (offset < value.length) {
                const index = lowerValue.indexOf(lowerQuery, offset);
                if (index === -1) {
                    container.appendChild(document.createTextNode(value.slice(offset)));
                    break;
                }
                if (index > offset) container.appendChild(document.createTextNode(value.slice(offset, index)));
                const mark = document.createElement('mark');

        function requestSearch(term) {

            if (!trimmed) {

            openSearchPanel();

        const mobileViewportQuery = window.matchMedia('(max-width: 700px)');
        function syncMobileViewportHeight() {
            const root = document.documentElement;
            if (!mobileViewportQuery.matches) {
                ['--mobile-viewport-height', '--mobile-viewport-width', '--mobile-viewport-top', '--mobile-viewport-left']
                    .forEach(name => root.style.removeProperty(name));
                return;
            }
            const viewport = window.visualViewport;
            const viewportHeight = viewport ? viewport.height : window.innerHeight;
            const viewportWidth = viewport ? viewport.width : window.innerWidth;
            const viewportTop = viewport ? viewport.offsetTop : 0;
            const viewportLeft = viewport ? viewport.offsetLeft : 0;
            root.style.setProperty('--mobile-viewport-height', `${Math.ceil(viewportHeight)}px`);
            root.style.setProperty('--mobile-viewport-width', `${Math.ceil(viewportWidth)}px`);
            root.style.setProperty('--mobile-viewport-top', `${Math.floor(viewportTop)}px`);
            root.style.setProperty('--mobile-viewport-left', `${Math.floor(viewportLeft)}px`);
        }
        syncMobileViewportHeight();
        window.addEventListener('resize', syncMobileViewportHeight, { passive: true });
        if (mobileViewportQuery.addEventListener) mobileViewportQuery.addEventListener('change', syncMobileViewportHeight);

        function parseMessageText(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let result = '';
            let lastIndex = 0;
            for (const match of text.matchAll(urlRegex)) {
                const url = match[0];
                const index = match.index ?? 0;
                result += escapeHtml(text.slice(lastIndex, index));
                const safeUrl = escapeHtml(url);
                result += `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="color:white; text-decoration:underline;">${safeUrl}</a>`;
                lastIndex = index + url.length;
            }
            return result + escapeHtml(text.slice(lastIndex));
        }

        function generateLinkPreview(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const match = text.match(urlRegex);
            if (!match) return null;

            const url = match[0];
            let parsedUrl;
            try {
                parsedUrl = new URL(url);
                if (!['http:', 'https:'].includes(parsedUrl.protocol)) return null;
            } catch (e) {
                return null;
            }

            const safeUrl = escapeHtml(url);
            const safeDomain = escapeHtml(parsedUrl.hostname || 'Link');
            const isImage = /\.(jpeg|jpg|gif|png)(?:[?#].*)?$/i.test(url);
            const youtubeMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);

            if (isImage) {
                return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer"><img src="${safeUrl}" style="max-width:100%; border-radius:8px; margin-top:5px;"></a>`;
            }
            if (youtubeMatch) {
                const id = youtubeMatch[1];
                return `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen style="border-radius:8px; margin-top:5px;"></iframe>`;
            }
            return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="link-card"><div class="link-icon">🔗</div><div class="link-info"><div class="link-title">${safeDomain}</div><div class="link-url">${safeUrl}</div></div></a>`;
        }

        function messageIdOf(data) {
            const value = data && (data.msgId || data._id);
            return value == null ? '' : String(value);
        }

        function messageMatchesCurrentContext(data, isSelf) {
            const isDM = !!data.toUser;
            if (state.chatContext === 'public') return !isDM;
            if (!isDM) return false;
            const partner = isSelf ? data.toUser : data.user;
            return partner === state.chatContext;
        }

        function captureScrollAnchor() {
            const viewportTop = chatWindow.getBoundingClientRect().top;
            const candidates = Array.from(chatWindow.querySelectorAll('.message-bubble, .message.bot'));
            const element = candidates.find(el => el.getBoundingClientRect().bottom >= viewportTop);
            if (!element || !element.id) return null;
            return { id: element.id, top: element.getBoundingClientRect().top };
        }

        function restoreScrollAnchor(anchor) {
            if (!anchor) return;
            const element = document.getElementById(anchor.id);
            if (!element) return;
            const delta = element.getBoundingClientRect().top - anchor.top;
            if (Math.abs(delta) > 0.5) chatWindow.scrollTop += delta;
        }

        function groupCanStack(group, data, isDM, dmPartner, isSelf, validTimestamp, prepend) {
            if (!group || !group.classList.contains('msg-group')) return false;
            if (group.dataset.sender !== data.user) return false;
            if ((group.dataset.isDm === 'true') !== isDM) return false;
            if ((group.dataset.dmPartner || '') !== (dmPartner || '')) return false;
            if (group.classList.contains('user') !== isSelf) return false;
            const boundaryTs = Number(prepend ? group.dataset.firstTs : group.dataset.lastTs);
            if (!Number.isFinite(boundaryTs)) return false;
            const diff = prepend ? boundaryTs - validTimestamp : validTimestamp - boundaryTs;
            return diff >= 0 && diff < 300000;
        }

        function addLongPressAction(element, callback, { delay = 520, moveTolerance = 12 } = {}) {
            let timer = null;
            let startX = 0;
            let startY = 0;
            let suppressClick = false;

            const cancel = () => {
                if (timer) clearTimeout(timer);
                timer = null;
            };

            element.addEventListener('pointerdown', (event) => {
                if (event.pointerType === 'mouse' || event.button !== 0) return;
                startX = event.clientX;
                startY = event.clientY;
                suppressClick = false;
                cancel();
                timer = setTimeout(() => {
                    timer = null;
                    suppressClick = true;
                    if (navigator.vibrate) navigator.vibrate(18);
                    callback({ clientX: startX, clientY: startY, pointerType: event.pointerType });
                }, delay);
            }, { passive: true });

            element.addEventListener('pointermove', (event) => {
                if (!timer) return;
                if (Math.hypot(event.clientX - startX, event.clientY - startY) > moveTolerance) cancel();
            }, { passive: true });

            element.addEventListener('pointerup', cancel, { passive: true });
            element.addEventListener('pointercancel', cancel, { passive: true });
            element.addEventListener('lostpointercapture', cancel, { passive: true });
            element.addEventListener('click', (event) => {
                if (!suppressClick) return;
                suppressClick = false;
                event.preventDefault();
                event.stopImmediatePropagation();
            }, true);
        }

        function addMessageToUI(data, isSelf, options = {}) {
            const prepend = options.prepend === true;
            const isLiveEvent = options.isLive === true;
            const msgId = messageIdOf(data);
            if (!msgId || document.getElementById(msgId)) return;
            const isDM = !!data.toUser;
            const dmPartner = isDM ? (isSelf ? data.toUser : data.user) : null;
            const isNew = isLiveEvent && !!state.currentUser && !isSelf;
            const isSearching = document.getElementById('search-input').value.trim() !== '';
            const parsedTimestamp = data.timestamp ? new Date(data.timestamp).getTime() : Date.now();
            const validTimestamp = Number.isFinite(parsedTimestamp) ? parsedTimestamp : Date.now();

            if(isDM && dmPartner) {
                state.dmContacts.add(dmPartner);
                if (isNew && state.chatContext !== dmPartner) {
                    state.unread[dmPartner] = (state.unread[dmPartner] || 0) + 1;
                    updateUnreadBadges();
                }
                updateDMList();
            }

            if (!messageMatchesCurrentContext(data, isSelf)) return;

            if (isNew && (isMinimized || !isUserAtBottom) && !isSearching) {
                if (unreadCount === 0) {
                    dividerElement = document.createElement('div');
                    dividerElement.className = 'new-msg-divider';
                    const label = document.createElement('span');
                    label.innerText = 'New Messages';
                    dividerElement.appendChild(label);
                    chatWindow.appendChild(dividerElement);
                }
                unreadCount++;
                if(!isMinimized) {
                    document.getElementById('new-msg-notification').style.display = 'block';
                    document.getElementById('new-msg-notification').innerText = `↓ ${unreadCount} New Message${unreadCount > 1 ? 's' : ''}`;
                } else {
                    document.getElementById('minimized-text').innerText = `${unreadCount} New Message${unreadCount > 1 ? 's' : ''}`;
                }
            }

            if(data.type === 'bot') {
                const div = document.createElement('div');
                div.className = 'message bot';
                div.id = msgId;
                div.innerText = data.text || '';
                if(prepend) chatWindow.prepend(div); else chatWindow.appendChild(div);
                if(!prepend) { lastSenderId = 'system'; lastMessageTime = 0; currentGroup = null; }
            } else {
                let groupToStack = null;
                if (prepend) {
                    const firstChild = chatWindow.firstElementChild;
                    if (groupCanStack(firstChild, data, isDM, dmPartner, isSelf, validTimestamp, true)) groupToStack = firstChild;
                } else if (groupCanStack(currentGroup, data, isDM, dmPartner, isSelf, validTimestamp, false)) {
                    groupToStack = currentGroup;
                }

                if (!groupToStack) {
                    groupToStack = document.createElement('div');
                    groupToStack.className = `msg-group ${isSelf ? 'user' : 'other'}`;
                    groupToStack.dataset.isDm = String(isDM);
                    groupToStack.dataset.sender = data.user || '';

        document.getElementById('chat-form').addEventListener('submit', (e) => { e.preventDefault(); const text = msgInput.value.trim(); if((text || pendingFiles.length > 0) && socket) { const toUser = state.chatContext === 'public' ? null : state.chatContext; socket.emit('chatMessage', { text, toUser, files: pendingFiles, replyTo: currentReply }); msgInput.value = ''; clearTimeout(typingTimer); stopTyping(); pendingFiles = []; currentReply = null; updateContextBar(); } });
        document.getElementById('upload-btn').addEventListener('click', () => { document.getElementById('file-input').click(); });
        document.getElementById('file-input').addEventListener('change', function() { const files = Array.from(this.files); if(files.length === 0) return; files.forEach(file => { const reader = new FileReader(); reader.onload = (e) => { pendingFiles.push({ name: file.name, type: file.type, data: e.target.result }); updateContextBar(); }; reader.readAsDataURL(file); }); this.value = ''; });
        function resizeSceneRenderer() {
            const width = Math.max(1, Math.ceil(document.documentElement.clientWidth || window.innerWidth));
            const height = Math.max(1, Math.ceil(document.documentElement.clientHeight || window.innerHeight));
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(width, height, false);
        }
        resizeSceneRenderer();
        window.addEventListener('resize', resizeSceneRenderer, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(resizeSceneRenderer, 60), { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeSceneRenderer, { passive: true });
            window.visualViewport.addEventListener('scroll', resizeSceneRenderer, { passive: true });
        }
        const ctxMenu = document.getElementById('context-menu'); let selectedMsgData = null;
        function showContextAt(x, y, data) {
            selectedMsgData = data;
            ctxMenu.style.display = 'flex';
            if (window.matchMedia('(max-width: 700px)').matches) {
                ctxMenu.style.left = '12px';
                ctxMenu.style.top = 'auto';
                return;
            }
            const menuWidth = 152;
            const menuHeight = 104;
            const safeX = Math.max(8, Math.min(Number(x) || 8, window.innerWidth - menuWidth - 8));
            const safeY = Math.max(8, Math.min(Number(y) || 8, window.innerHeight - menuHeight - 8));
            ctxMenu.style.left = `${safeX}px`;
            ctxMenu.style.top = `${safeY}px`;
        }
        function showContext(e, data) {
            if (e && typeof e.preventDefault === 'function') e.preventDefault();
            showContextAt(e && (e.clientX ?? e.pageX), e && (e.clientY ?? e.pageY), data);
        }
        document.getElementById('ctx-reply').addEventListener('click', () => { if(selectedMsgData) { currentReply = selectedMsgData; updateContextBar(); document.getElementById('msg-input').focus(); } ctxMenu.style.display = 'none'; });
        document.getElementById('ctx-pin').addEventListener('click', () => { if(selectedMsgData) socket.emit('pinMessage', selectedMsgData); ctxMenu.style.display = 'none'; });
        document.getElementById('ctx-cancel').addEventListener('click', () => { ctxMenu.style.display = 'none'; });
        document.addEventListener('click', (e) => { if(!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none'; });
    </script>
</body>
</html>
